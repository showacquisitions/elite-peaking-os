<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0d13" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Elite OS" />
<title>Elite Aesthetic Training & Nutrition OS</title>
<style>
  :root{--bg:#0a0d13;--panel:#121722;--panel2:#19202e;--border:#263045;--text:#e8eef5;--muted:#8793a3;--accent:#3b82f6;--glow:rgba(59,130,246,.18);--green:#10b981;--amber:#f59e0b;--red:#ef4444;--font:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5;padding:20px 20px 110px;max-width:1280px;margin:0 auto}
  h1{font-size:1.35rem;font-weight:800;letter-spacing:-.02em}
  .sub{color:var(--muted);font-size:.85rem}
  header{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 22px;margin-bottom:14px}
  input,select,textarea{background:var(--bg);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:6px;font:inherit;font-size:.88rem;font-weight:600;max-width:100%}
  input.bad{border-color:var(--red)}
  textarea{width:100%;min-height:70px;font-weight:500;resize:vertical}
  button{font:inherit}
  .btn{background:transparent;border:1px solid var(--border);color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:.78rem}
  .btn:hover{color:var(--text);border-color:var(--accent)}
  .btn.danger:hover{color:var(--red);border-color:var(--red)}
  .overall{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 18px;margin-bottom:14px;display:flex;align-items:center;gap:14px}
  .overall .bar{flex:1;height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
  .overall .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--green));transition:width .25s}
  .overall b{font-size:.85rem;min-width:170px;text-align:right}
  .tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .tab{background:var(--panel);color:var(--muted);border:1px solid var(--border);padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.88rem}
  .tab.active,.tab:hover{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 12px var(--glow)}
  .pane{display:none}.pane.active{display:block}
  .cg{display:flex;flex-direction:column;gap:4px}
  .cg label{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{background:var(--bg);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:.8rem;cursor:pointer;display:flex;gap:6px;align-items:center}
  .chip input{accent-color:var(--green)}
  .days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
  @media(max-width:768px){.days{grid-template-columns:repeat(4,1fr)}}
  .day{background:var(--panel);border:1px solid var(--border);color:var(--text);padding:9px 5px;border-radius:8px;cursor:pointer;text-align:center}
  .day.active{border-color:var(--accent);background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
  .day.done{border-color:var(--green)}
  .day b{display:block;font-size:.88rem}.day small{display:block;font-size:.68rem;color:var(--muted)}
  .day .mini{height:4px;background:var(--bg);border-radius:2px;margin-top:6px;overflow:hidden}
  .day .mini i{display:block;height:100%;background:var(--green)}
  .wknav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 15px}
  .kpi .l{font-size:.7rem;color:var(--muted);text-transform:uppercase;font-weight:700}
  .kpi .v{font-size:1.4rem;font-weight:800;margin-top:3px}
  .kpi .s{font-size:.74rem;color:var(--muted);margin-top:2px}
  .ring{display:flex;align-items:center;gap:12px}
  .grid2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
  @media(max-width:960px){.grid2{grid-template-columns:1fr}}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
  .card h2{font-size:1.02rem;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:10px}
  .card h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 6px}
  .badge{font-size:.7rem;padding:3px 9px;border-radius:999px;background:var(--glow);color:var(--accent);font-weight:700;white-space:nowrap}
  .badge.g{background:rgba(16,185,129,.15);color:var(--green)}.badge.a{background:rgba(245,158,11,.15);color:var(--amber)}
  .row{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid var(--border)}
  .row:last-child{border-bottom:none}
  .row>input[type=checkbox]{margin-top:4px;width:17px;height:17px;accent-color:var(--green);cursor:pointer;flex:none}
  .row.done .t{text-decoration:line-through;color:var(--muted)}
  .row .body{flex:1;min-width:0}
  .btns{display:flex;flex-direction:column;gap:4px;flex:none}
  .t{font-weight:600;font-size:.91rem}.d{font-size:.79rem;color:var(--muted);margin-top:2px}
  .cue{font-size:.76rem;color:#a5b4c8;margin-top:2px;font-style:italic}
  .perf{margin-top:5px;width:100%;max-width:240px;font-size:.76rem;font-weight:500;padding:3px 8px}
  .rest{border:1px solid var(--border);background:var(--panel2);color:var(--muted);border-radius:6px;padding:2px 8px;font-size:.72rem;cursor:pointer;white-space:nowrap}
  .rest:hover{color:var(--accent);border-color:var(--accent)}
  .macros{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
  .macros span{font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--bg)}
  .mp{color:var(--accent)}.mc{color:var(--green)}.mf{color:var(--amber)}.mk{color:var(--muted)}
  .mbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bg);margin-top:8px}
  .mbar .p{background:var(--accent)}.mbar .c{background:var(--green)}.mbar .f{background:var(--amber)}
  .note{background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);border-radius:8px;padding:10px 14px;font-size:.82rem;color:#e6cf9a;margin-bottom:14px}
  .vrow{display:grid;grid-template-columns:90px 1fr 34px 52px;gap:8px;align-items:center;padding:4px 0;font-size:.82rem}
  .vbar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}.vbar i{display:block;height:100%}
  .vrow small{color:var(--muted);font-size:.7rem}
  .log-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
  #timer{position:fixed;right:18px;bottom:18px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.5);z-index:10}
  #timer .clk{font-size:1.3rem;font-weight:800;min-width:62px;font-variant-numeric:tabular-nums}
  #timer.run .clk{color:var(--accent)}#timer.end .clk{color:var(--green)}
  .tab .ic,.tab .short{display:none}
  .days{scroll-snap-type:x proximity}
  @media(max-width:700px){
    body{padding:10px 10px 150px}
    h1{font-size:1.05rem}
    input,select,textarea{font-size:16px;min-height:42px}
    .btn,.rest{min-height:38px;padding:8px 12px;font-size:.85rem}
    .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;gap:0;background:var(--panel);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding:0 0 env(safe-area-inset-bottom);z-index:20}
    .tab{border:none;border-radius:0;background:transparent;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.66rem}
    .tab.active,.tab:hover{background:var(--glow);box-shadow:none;color:var(--accent)}
    .tab .ic{display:block;font-size:1.15rem}.tab .short{display:block}.tab .full{display:none}
    .days{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
    .day{flex:0 0 96px;scroll-snap-align:start;padding:10px 4px}
    .card{padding:14px}.row{padding:12px 0}
    .row>input[type=checkbox]{width:24px;height:24px;margin-top:2px}
    .t{font-size:.97rem}.d{font-size:.84rem}
    .kpis{grid-template-columns:1fr 1fr}
    .btns{flex-direction:row;flex-wrap:wrap}
    .vrow{grid-template-columns:72px 1fr 30px 46px}
    .overall b{min-width:0;font-size:.75rem}.overall>.sub{display:none}
    #timer{left:8px;right:8px;bottom:calc(58px + env(safe-area-inset-bottom));flex-wrap:nowrap;justify-content:center;gap:5px;padding:6px 8px}
    #timer .btn{min-height:34px;padding:4px 10px}#timer [data-t="45"],#timer [data-t="180"]{display:none}
    #timer .clk{font-size:1.15rem}
    .perf{max-width:100%}
  }
  details.rec{margin-top:6px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
  details.rec summary{cursor:pointer;font-size:.78rem;font-weight:700;color:var(--accent)}
  details.rec ol{margin:6px 0 2px 18px;font-size:.8rem;color:var(--text)}details.rec li{margin:3px 0}
  @media print{.tabs,#timer,.btn,.rest,.days,.wknav{display:none!important}.pane{display:block!important}body{background:#fff;color:#000}.card,.kpi{border-color:#999;background:#fff}}
</style>
</head>
<body>
<header>
  <h1>ELITE AESTHETIC TRAINING & NUTRITION OS</h1>
  <p class="sub" id="sub"></p>
</header>
<div class="overall"><span class="sub">This week</span><div class="bar"><div id="overallFill" style="width:0"></div></div><b id="overallTxt"></b></div>
<nav class="tabs">
  <button class="tab" data-tab="profile"><span class="ic">👤</span><span class="full">1. Profile & Goals</span><span class="short">Profile</span></button>
  <button class="tab" data-tab="overview"><span class="ic">📊</span><span class="full">2. Overview</span><span class="short">Overview</span></button>
  <button class="tab active" data-tab="plan"><span class="ic">🏋️</span><span class="full">3. Week Plan</span><span class="short">Plan</span></button>
  <button class="tab" data-tab="grocery"><span class="ic">🛒</span><span class="full">4. Groceries</span><span class="short">Groceries</span></button>
  <button class="tab" data-tab="progress"><span class="ic">📈</span><span class="full">5. Progress & Auto-adjust</span><span class="short">Progress</span></button>
</nav>

<section id="pane-profile" class="pane"></section>
<section id="pane-overview" class="pane"></section>

<section id="pane-plan" class="pane active">
  <div class="wknav" id="weekNav"></div>
  <div class="days" id="days"></div>
  <div class="kpis" id="kpis"></div>
  <div id="peakNote"></div>
  <div class="grid2">
    <div class="card"><h2><span id="wTitle"></span><span class="badge" id="wBadge"></span></h2><div id="wList"></div></div>
    <div>
      <div class="card"><h2><span>Meals</span><span class="badge" id="mBadge"></span></h2><div id="mList"></div></div>
      <div class="card"><h2><span>Daily habits</span></h2><div id="hList"></div></div>
    </div>
  </div>
</section>

<section id="pane-grocery" class="pane">
  <div class="card"><h2><span>Shopping list for the displayed week</span><span style="display:flex;gap:8px;align-items:center"><span class="badge" id="gBadge"></span><button class="btn" id="gShare">Share / copy</button></span></h2><div id="gList"></div></div>
</section>

<section id="pane-progress" class="pane">
  <div class="grid2">
    <div class="card"><h2><span>Daily log</span><input type="date" id="logDate"/></h2>
      <div class="log-grid">
        <div class="cg"><label id="lwl">Morning weight</label><input type="number" step="0.1" id="lw"/></div>
        <div class="cg"><label id="lwal">Waist</label><input type="number" step="0.1" id="lwa"/></div>
        <div class="cg"><label>Sleep (h)</label><input type="number" step="0.25" id="ls"/></div>
        <div class="cg"><label>Energy (1–5)</label><input type="number" min="1" max="5" id="le"/></div>
      </div>
      <h3>Notes</h3><textarea id="ln" placeholder="Pump, strength, hunger, mood, mirror check…"></textarea></div>
    <div class="card"><h2><span>Weekly check-in</span></h2><div id="checkin"></div></div>
    <div class="card"><h2><span>Trend & auto-adjust</span></h2><div id="trend"></div><h3>Weight, last 28 days</h3><div id="logWt"></div></div>
  </div>
</section>

<input type="file" id="fileIn" accept="application/json" hidden />
<div id="timer"><span class="sub">Rest</span><span class="clk" id="clk">0:00</span>
  <button class="btn" data-t="45">45</button><button class="btn" data-t="60">60</button><button class="btn" data-t="90">90</button><button class="btn" data-t="120">120</button><button class="btn" data-t="180">180</button><button class="btn" id="tStop">Stop</button></div>

<script>
/* ===================== ENGINE (pure, no DOM) ===================== */
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseISO=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=parseISO(s);d.setDate(d.getDate()+n);return iso(d)};
const diffD=(a,b)=>Math.round((parseISO(b)-parseISO(a))/864e5);
const mondayOf=s=>{const d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const mod=(a,n)=>((a%n)+n)%n;
const LB=2.20462, IN=2.54;
const fmtW=(kg,u)=>u==="metric"?`${Math.round(kg*2)/2} kg`:`${Math.round(kg*LB*2)/2} lb`;
const kcalOf=m=>4*m.P+4*m.C+9*m.F;

const EQUIP=[["pullbar","Pull-up bar"],["bands","Resistance bands"],["bag","Weighted bag / vest"],["db","Dumbbells"],["bb","Barbell + rack"],["bench","Bench"],["cable","Cable / machines (gym)"],["dipbars","Dip bars / parallettes"],["lowbar","Rings / low bar / sturdy table"],["step","Step / box"]];
const MUSCLES=[["chest","Chest"],["back","Back"],["shoulders","Shoulders"],["biceps","Biceps"],["triceps","Triceps"],["quads","Quads"],["hams","Hamstrings"],["glutes","Glutes"],["calves","Calves"],["abs","Abs"]];

/* ---------- EXERCISE DATABASE (best-first within each slot) ---------- */
const X=(slot,id,n,mu,o)=>Object.assign({slot,id,n,mu,mu2:[],eq:[],ay:null,cal:false,c:true,rr:[8,12],rest:90,cue:"",bm:null,bmr:[0,999],bmReps:false,w:null,unit:"",ph:0},o);
const EX=[
 /* vertical pull */
 X("vpull","wpu","Weighted pull-up","back",{mu2:["biceps"],eq:["pullbar"],ay:["bag","db"],cal:1,rr:[5,8],rest:150,w:"bagdb",bm:"pull",bmr:[10,999],cue:"Dead hang to chin over bar. Drive elbows to ribs."}),
 X("vpull","pu","Pull-up","back",{mu2:["biceps"],eq:["pullbar"],cal:1,rr:[6,10],rest:120,bm:"pull",bmr:[4,999],bmReps:true,cue:"Full hang, chest to bar, no kipping."}),
 X("vpull","chin","Chin-up (supinated)","back",{mu2:["biceps"],eq:["pullbar"],cal:1,rr:[6,10],rest:120,bm:"pull",bmr:[3,999],bmReps:true,cue:"Palms toward you, lead with the chest."}),
 X("vpull","npu","Neutral / close-grip pull-up","back",{mu2:["biceps"],eq:["pullbar"],cal:1,rr:[6,10],rest:120,bm:"pull",bmr:[5,999],bmReps:true,cue:"Elbows to hips, big stretch at the bottom."}),
 X("vpull","pd","Lat pulldown","back",{mu2:["biceps"],eq:["cable"],rr:[8,12],rest:90,w:"mach",cue:"Pull to the upper chest, avoid leaning back."}),
 X("vpull","bapu","Band-assisted pull-up","back",{mu2:["biceps"],eq:["pullbar","bands"],cal:1,rr:[5,8],rest:120,bm:"pull",bmr:[0,5],w:"band",cue:"Use the thinnest band that still allows the target reps."}),
 X("vpull","negpu","Negative pull-up (5s lowering)","back",{mu2:["biceps"],eq:["pullbar"],cal:1,rr:[3,5],rest:120,bm:"pull",bmr:[0,5],cue:"Jump to the top, lower for 5 full seconds."}),
 X("vpull","bpd","Banded lat pulldown","back",{mu2:["biceps"],eq:["bands"],rr:[12,15],rest:60,w:"band",cue:"Anchor the band high (door anchor), pull to the chest."}),
 X("vpull","sup","Prone superman pull-down","back",{rr:[12,15],rest:45,cue:"Lie face down, sweep arms from overhead to ribs."}),
 /* horizontal pull */
 X("hrow","wir","Weighted inverted row","back",{mu2:["biceps"],eq:["lowbar"],ay:["bag","db"],cal:1,rr:[8,12],rest:90,w:"bagdb",cue:"Body in a straight line, chest to the bar, 1s squeeze."}),
 X("hrow","ir","Inverted row (rings / low bar / table)","back",{mu2:["biceps"],eq:["lowbar"],cal:1,rr:[8,15],rest:75,cue:"Straight body, pull chest to the bar."}),
 X("hrow","bbr","Barbell row","back",{mu2:["biceps"],eq:["bb"],rr:[6,10],rest:120,w:"bb",cue:"Hinge to ~45°, row to the lower ribs."}),
 X("hrow","dbr","One-arm dumbbell row","back",{mu2:["biceps"],eq:["db"],rr:[8,12],rest:90,w:"db",cue:"Pull the elbow to the hip, full stretch at the bottom."}),
 X("hrow","csr","Chest-supported dumbbell row","back",{mu2:["biceps"],eq:["db","bench"],rr:[8,12],rest:90,w:"db",cue:"Chest on an incline bench, squeeze shoulder blades."}),
 X("hrow","cr","Seated cable row","back",{mu2:["biceps"],eq:["cable"],rr:[8,12],rest:90,w:"mach",cue:"Tall chest, row to the navel."}),
 X("hrow","brow","Banded row","back",{mu2:["biceps"],eq:["bands"],rr:[12,15],rest:60,w:"band",cue:"Anchor at chest height, pause 1s at the squeeze."}),
 X("hrow","prw","Prone reverse snow angel","back",{rr:[12,15],rest:45,cue:"Face down, sweep arms wide with straight elbows."}),
 /* horizontal push */
 X("hpush","wpush","Weighted push-up (bag / vest)","chest",{mu2:["triceps","shoulders"],ay:["bag"],cal:1,rr:[8,12],rest:90,w:"bagdb",bm:"push",bmr:[20,999],cue:"Chest to floor, full lockout, ribs down."}),
 X("hpush","bench","Barbell bench press","chest",{mu2:["triceps","shoulders"],eq:["bb","bench"],rr:[5,8],rest:150,w:"bb",cue:"Shoulder blades pinned, bar to the lower chest."}),
 X("hpush","dbb","Dumbbell bench press","chest",{mu2:["triceps","shoulders"],eq:["db","bench"],rr:[8,12],rest:120,w:"db",cue:"Deep stretch, press slightly inward."}),
 X("hpush","fepu","Feet-elevated push-up","chest",{mu2:["triceps","shoulders"],cal:1,rr:[8,15],rest:90,bm:"push",bmr:[12,999],bmReps:true,cue:"Feet on a chair, body rigid, chest to the floor."}),
 X("hpush","dip","Parallel-bar dip (chest lean)","chest",{mu2:["triceps","shoulders"],eq:["dipbars"],cal:1,rr:[6,12],rest:120,bm:"push",bmr:[12,999],cue:"Lean forward, elbows out slightly, deep stretch."}),
 X("hpush","pu","Push-up","chest",{mu2:["triceps","shoulders"],cal:1,rr:[8,20],rest:75,bm:"push",bmr:[6,40],bmReps:true,cue:"Hands under shoulders, elbows ~45°."}),
 X("hpush","arch","Archer push-up","chest",{mu2:["triceps","shoulders"],cal:1,rr:[4,8],rest:120,bm:"push",bmr:[25,999],cue:"Shift weight to one side, other arm stays straight."}),
 X("hpush","bpu","Banded push-up","chest",{mu2:["triceps","shoulders"],eq:["bands"],cal:1,rr:[8,15],rest:90,bm:"push",bmr:[10,999],w:"band",cue:"Band across the upper back, press against the lockout."}),
 X("hpush","cp","Cable / machine chest press","chest",{mu2:["triceps","shoulders"],eq:["cable"],rr:[8,12],rest:90,w:"mach",cue:"Control the stretch, squeeze at the center."}),
 X("hpush","fp","Dumbbell floor press","chest",{mu2:["triceps"],eq:["db"],rr:[8,12],rest:90,w:"db",cue:"Pause the triceps on the floor, then drive up."}),
 X("hpush","ipu","Incline push-up (hands on bench / chair)","chest",{mu2:["triceps","shoulders"],cal:1,rr:[8,15],rest:75,bm:"push",bmr:[0,10],cue:"Lower the incline each week until floor push-ups are possible."}),
 /* vertical push */
 X("vpush","ohp","Barbell overhead press","shoulders",{mu2:["triceps"],eq:["bb"],rr:[5,8],rest:150,w:"bb",cue:"Squeeze glutes, bar path close to the face."}),
 X("vpush","dbp","Seated dumbbell shoulder press","shoulders",{mu2:["triceps"],eq:["db","bench"],rr:[8,12],rest:120,w:"db",cue:"Elbows slightly in front, full lockout."}),
 X("vpush","dbps","Standing dumbbell shoulder press","shoulders",{mu2:["triceps"],eq:["db"],rr:[8,12],rest:120,w:"db",cue:"Ribs down, press in a slight arc."}),
 X("vpush","fpike","Feet-elevated pike push-up","shoulders",{mu2:["triceps"],cal:1,rr:[6,12],rest:90,bm:"push",bmr:[10,999],cue:"Hips high, head travels between the hands."}),

/* ---------- TARGETS ---------- */
function baseTargets(p){
  const w=p.kg,male=p.sex==="m",bf=p.bf>0?p.bf:0,notes=[];
  const lbm=bf?w*(1-bf/100):null;
  const bmr=lbm?370+21.6*lbm:10*w+6.25*p.cm-5*p.age+(male?5:-161);
  const tdee=bmr*ACT[p.act];
  let goal=p.goal;
  const lowBf=bf&&(male?bf<10:bf<18);
  if(goal==="cut"&&p.age<18){goal="recomp";notes.push("Under 18: fat-loss deficits are disabled. Plan set to maintenance and strength.")}
  else if(goal==="cut"&&lowBf){goal="recomp";notes.push("Body fat is already low: deficit disabled. Plan set to maintenance.")}
  let pct=0;
  if(goal==="cut")pct=-({cons:.10,std:.18,agg:.25}[p.rate]);
  else if(goal==="bulk")pct={cons:.05,std:.10,agg:.15}[p.rate];
  else if(goal==="recomp")pct=(bf&&bf>=(male?18:28))?-.05:0;
  let kcal=tdee*(1+pct)+(p.kcalAdj||0);
  const floor=male?1500:1200;
  if(kcal<floor){kcal=floor;notes.push(`Calories raised to the ${floor} kcal safety floor.`)}
  let P=({cut:2.2,peak:2.0}[goal]||2.0)*w;
  if(lbm)P=Math.min(P,2.7*lbm);
  let F=Math.max(.7*w,.22*kcal/9),C=(kcal-4*P-9*F)/4;
  if(C<1.5*w){F=Math.max(.6*w,(kcal-4*P-6*w)/9);C=Math.max(0,(kcal-4*P-9*F)/4);notes.push("Carbs are low for hard training. Consider a slower rate of loss.")}
  return {bmr,tdee,goal,pct,kcal:4*P+4*C+9*F,P,C,F,lbm,notes,fiber:14*kcal/1000,water:Math.round(w*35/100)/10,floor};
}

/* ---------- PICKERS ---------- */
function eligible(slot,p){
  const has=k=>p.eq.includes(k);
  const inj=p.inj||[];
  let list=EX.filter(e=>e.slot===slot&&e.eq.every(has)&&!inj.some(j=>AV[j]&&AV[j].includes(e.slot+":"+e.id))&&(!e.ay||e.ay.some(has))&&(!e.bm||(p[e.bm+"Max"]>=e.bmr[0]&&p[e.bm+"Max"]<=e.bmr[1])));
  if(p.style==="cal")list=list.map((e,i)=>[e,i]).sort((a,b)=>(b[0].cal-a[0].cal)||(a[1]-b[1])).map(x=>x[0]);
  else if(p.style==="wt")list=list.map((e,i)=>[e,i]).sort((a,b)=>(a[0].cal-b[0].cal)||(a[1]-b[1])).map(x=>x[0]);
  return list;
}
function pickEx(slot,v,p,block,used,swap){
  const list=eligible(slot,p),n=list.length;
  if(!n)return null;
  const K=Math.min(3,n),start=(v+mod(block,K)+(swap||0))%n;
  for(let k=0;k<n;k++){const e=list[(start+k)%n];if(!used.has(e.n)){used.add(e.n);return e}}
  return null;
}
function loadText(e,p){
  const bag=p.eq.includes("bag");
  switch(e.w){
    case "bagdb":return bag?`Bag / vest ${fmtW(p.bagKg,p.units)}`:"Dumbbell (heavy enough for target RIR)";
    case "optbag":return bag?`Bodyweight, bag ${fmtW(p.bagKg,p.units)} when easy`:"Bodyweight, add dumbbells when easy";
    case "db":return "Dumbbells, load for target RIR";
    case "bb":return "Barbell, load for target RIR";
    case "band":return "Band tier for target RIR";
    case "mach":return "Stack, load for target RIR";
    default:return "Bodyweight";
  }
}

/* ---------- PROGRAM + SESSIONS ---------- */
const RIR={beg:[3,3,2,4],int:[3,2,1,4],adv:[3,2,1,4]};
function setsFor(p,e,wk,priBoost){
  let b=e.c?{beg:3,int:4,adv:4}[p.exp]:{beg:2,int:3,adv:3}[p.exp];
  if(wk===2&&p.exp!=="beg")b+=1;
  b+=priBoost;
  if(p.days>=6)b-=1;
  b=Math.min(b,5);
  return wk===3?Math.max(2,Math.ceil(b*.6)):b;
}
function priBoostFor(e,slot,p){
  const g=SLOTMU[slot];
  return (p.pri||[]).includes(g)?1:0;
}
function buildProgram(p,block,swaps){
  const pat=SPLIT[p.days]||SPLIT[4],maxEx=MAXEX[p.len]||7,out=[];
  pat.forEach(([dow,key],si)=>{
    const [name,slots0]=SES[key];
    let slots=slots0.map(s=>s.slice());
    (p.pri||[]).forEach((g,gi)=>{
      const arr=PRI_EXTRA[g]||[],sl=arr[gi%arr.length];
      const first=pat.findIndex(([,k])=>SES[k][1].some(x=>SLOTMU[x[0]]===g));
      if(sl&&first===si&&!slots.some(x=>x[0]===sl&&x[1]===2))slots.splice(Math.min(2,slots.length),0,[sl,2]);
    });
    slots=slots.slice(0,maxEx);
    const used=new Set(),ex=[];
    slots.forEach((s,idx)=>{
      const key2=`${name}|${idx}`;
      const e=pickEx(s[0],s[1],p,block,used,swaps&&swaps[key2]||0);
      if(e)ex.push({e,slot:s[0],key:key2,pri:priBoostFor(e,s[0],p)});
    });
    out.push({dow,name,ex});
  });
  return out;
}
function instSession(sess,p,wk){
  const rir=RIR[p.exp][wk];
  return {name:sess.name,dow:sess.dow,wk,rir,ex:sess.ex.map(x=>{
    const e=x.e,sets=setsFor(p,e,wk,x.pri);
    let reps;
    if(e.bmReps){const m=p[e.bm+"Max"];reps=`${Math.max(1,m-rir)}`;}
    else reps=`${e.rr[0]}–${e.rr[1]}`;
    if(e.unit)reps+=e.unit;
    return {id:e.id,uid:`${e.slot}:${e.id}`,name:e.n,slot:x.slot,key:x.key,sets,reps,rir,rest:e.rest,cue:e.cue,load:loadText(e,p),mu:e.mu,mu2:e.mu2,bmReps:!!e.bmReps,
            note:e.bmReps?`Sets at max (${p[e.bm+"Max"]}) − ${rir} RIR`:""};
  })};
}
function pumpCircuit(p,block,rounds){
  const used=new Set(),ex=[];
  ["hpush","vpull","lateral","biceps","triceps"].forEach(sl=>{
    const e=pickEx(sl,0,p,block,used,0);
    if(e)ex.push({id:e.id,uid:`pump:${e.id}`,name:e.n,slot:sl,key:"pump",sets:rounds,reps:e.unit?`${e.rr[0]}${e.unit}`:"15–25",rir:4,rest:e.rest>60?45:30,cue:"Light, fast, constant tension. No sweat, stop 4 reps short.",load:loadText(e,p),mu:e.mu,mu2:e.mu2,note:""});
  });
  return ex;
}
function weeklyVolume(sessions){
  const v={};
  MUSCLES.forEach(([k])=>v[k]=0);
  sessions.forEach(s=>s.ex.forEach(x=>{
    v[x.mu]=(v[x.mu]||0)+x.sets;
    (x.mu2||[]).forEach(m=>v[m]=(v[m]||0)+x.sets*.5);
  }));
  return v;
}

/* ---------- MEAL SOLVER ---------- */
function solveMeal(t,T){
  const fx=t.fx.map(([id,g])=>({id,g}));
  const fixed=fx.reduce((a,x)=>{const f=FOODS[x.id];return{P:a.P+f.p*x.g/100,C:a.C+f.c*x.g/100,F:a.F+f.f*x.g/100}},{P:0,C:0,F:0});
  const R=[T.P-fixed.P,T.C-fixed.C,T.F-fixed.F];
  const ids=[t.p,t.c,t.f],v=ids.map(id=>[FOODS[id].p/100,FOODS[id].c/100,FOODS[id].f/100]);
  const w=[2,1,1.2],cap=[600,FOODS[t.c].max||800,FOODS[t.f].max||90];
  const g=[0,0,0];
  for(let it=0;it<600;it++){
    for(let i=0;i<3;i++){
      let num=0,den=0;
      for(let k=0;k<3;k++){
        let r=R[k];for(let j=0;j<3;j++)r-=v[j][k]*g[j];
        num+=w[k]*v[i][k]*r;den+=w[k]*v[i][k]*v[i][k];
      }
      if(den>0)g[i]=Math.min(cap[i],Math.max(0,g[i]+num/den));
    }
  }
  const minP=v[0][0]>0?.7*R[0]/v[0][0]:0;
  if(g[0]<minP){
    g[0]=Math.min(cap[0],minP);
    for(let it=0;it<400;it++)for(let i=1;i<3;i++){
      let num=0,den=0;
      for(let k=0;k<3;k++){let r=R[k];for(let j=0;j<3;j++)r-=v[j][k]*g[j];num+=w[k]*v[i][k]*r;den+=w[k]*v[i][k]*v[i][k]}
      if(den>0)g[i]=Math.min(cap[i],Math.max(0,g[i]+num/den));
    }
  }
  const items=[];
  ids.forEach((id,i)=>{
    const st=FOODS[id].st;
    let q=Math.round(g[i]/st)*st;
    if(FOODS[id].u&&FOODS[id].u[0]==="egg"&&q>0&&q<50)q=50;
    if(q>0)items.push({id,g:q});
  });
  fx.forEach(x=>items.push({id:x.id,g:x.g}));
  const m=items.reduce((a,x)=>{const f=FOODS[x.id];return{P:a.P+f.p*x.g/100,C:a.C+f.c*x.g/100,F:a.F+f.f*x.g/100}},{P:0,C:0,F:0});
  return {tid:t.id,name:t.n,items,P:Math.round(m.P),C:Math.round(m.C),F:Math.round(m.F),kcal:Math.round(kcalOf(m))};
}
const SUB={gyog:"lfgyog",cott:"lfcott"};
function lfMap(t){
  const m=Object.assign({},t,{p:SUB[t.p]||t.p,c:SUB[t.c]||t.c,f:SUB[t.f]||t.f,fx:t.fx.map(([id,g])=>[SUB[id]||id,g])});
  if(m.p!==t.p||m.c!==t.c||m.f!==t.f){
    m.n=t.n.replace("Greek yogurt","lactose-free Greek yogurt").replace(/[Cc]ottage cheese/,"lactose-free cottage cheese");
    m.n=m.n[0].toUpperCase()+m.n.slice(1);
  }
  return m;
}
function tplCost(t){
  const per=(id,k,amt)=>foodCost(id,amt/(FOODS[id][k]/100));
  return per(t.p,"p",30)+per(t.c,"c",60)+per(t.f,"f",12)+t.fx.reduce((a,[id,g])=>a+foodCost(id,g),0);
}
function buildMeals(p,macros,seed,swapOff){
  const ban=bannedTags(p),lf=ban.has("lactose"),pf=p.priceF||1,shares=SHARES[p.meals]||SHARES[4],usedT=new Set(),meals=[];
  const all=TPL.map(t=>lf?lfMap(t):t).filter(t=>tplOK(t,ban));
  shares.forEach(([slot,sh],i)=>{
    let pool=all.filter(t=>t.s.includes(slot));
    if(!pool.length)pool=all.filter(t=>t.s.includes("S"));
    if(p.budget==="budget"&&pool.length>3){pool=pool.slice().sort((x,y)=>tplCost(x)-tplCost(y));pool=pool.slice(0,Math.max(3,Math.ceil(pool.length*.6)))}
    if(!pool.length){meals.push({name:"Add a protein-rich meal that fits your diet",items:[],P:Math.round(macros.P*sh),C:Math.round(macros.C*sh),F:Math.round(macros.F*sh),kcal:Math.round(kcalOf({P:macros.P*sh,C:macros.C*sh,F:macros.F*sh})),slot,custom:true,cost:0});return}
    const start=mod(seed*7+i*3+(swapOff[i]||0),pool.length);
    let t=null;
    for(let k=0;k<pool.length;k++){const c=pool[(start+k)%pool.length];if(!usedT.has(c.id)){t=c;break}}
    if(!t)t=pool[start];
    usedT.add(t.id);
    const m=solveMeal(t,{P:macros.P*sh,C:macros.C*sh,F:macros.F*sh});
    m.slot=slot;m.share=sh;m.prep=[t.p,t.c,t.f].map(id=>FOODS[id].prep).filter(Boolean).join(" ");
    m.rec=REC[t.id]||null;
    m.cost=Math.round(m.items.reduce((a,it)=>a+foodCost(it.id,it.g),0)*pf*100)/100;
    meals.push(m);
  });
  return meals;
}

/* ---------- WEEK BUILDER ---------- */
function buildWeek(p,st,monISO,todayISO){
  const nTrain=(SPLIT[p.days]||SPLIT[4]).length;
  const bw=Math.floor(diffD(st.blockStart,monISO)/7),wk=mod(bw,4),block=Math.floor(bw/4)+(st.blockOffset||0);
  const T=baseTargets(p),notes=T.notes.slice();
  const program=buildProgram(p,block,st.swaps||{});
  const sess=program.map(s=>instSession(s,p,wk));
  const ev=p.goal==="peak"&&p.event?p.event:null;
  const toEv=ev?diffD(todayISO,ev):null;
  const peak=ev&&toEv>=0&&toEv<=7;
  const trainC=T.C*1.10,restC=nTrain<7?Math.max(1.0*p.kg,(7*T.C-nTrain*trainC)/(7-nTrain)):T.C;
  const days=[];
  for(let i=0;i<7;i++){
    let date,label,session=null,kind="rest",macros,phase=null,extra="";
    if(peak){
      date=addD(ev,i-6);phase=PEAK[i];
      macros=peakMacros(T,p,i);
      if(i<3){session=sess[i%sess.length];kind="train";label=session.name}
      else if(i===3){kind="flush";label="Zone 2 + decompression"}
      else if(i===4){kind="pump";label="Light pump";session={name:"Light pump (RIR 4)",rir:4,wk:0,ex:pumpCircuit(p,block,2)}}
      else if(i===5){kind="posing";label="Posing & vacuums"}
      else{kind="event";label="Pre-event pump (T – 75 min)";session={name:"Pre-event pump",rir:4,wk:0,ex:pumpCircuit(p,block,3)}}
    }else{
      date=addD(monISO,i);
      const hit=sess.find(s=>s.dow===i);
      if(hit){session=hit;kind="train";label=hit.name;macros={P:T.P,C:trainC,F:T.F}}
      else{label="Rest & recovery";macros={P:T.P,C:restC,F:T.F}}
    }
    macros.kcal=Math.round(kcalOf(macros));
    const meals=buildMeals(p,macros,bw*7+i,(st.mswaps&&st.mswaps[date])||[]);
    const act={P:0,C:0,F:0,kcal:0};
    meals.forEach(m=>{act.P+=m.P;act.C+=m.C;act.F+=m.F;act.kcal+=m.kcal});
    const cost=Math.round(meals.reduce((a,m)=>a+(m.cost||0),0)*100)/100;
    days.push({i,date,label,kind,session,macros,meals,actual:act,phase,cost});
  }
  const vol=weeklyVolume(sess);
  if((p.inj||[]).length)notes.push("Exercises that commonly aggravate "+p.inj.join(", ")+" were removed. Stop anything that hurts and see a clinician for persistent pain.");
  if(ev&&!peak)notes.push(`Peak week starts ${addD(ev,-6)}. Until then the plan runs at maintenance.`);
  return {T,days,wk,block,bw,vol,sessions:sess,peak:!!peak,notes,rir:RIR[p.exp][wk],nTrain};
}

/* ---------- GROCERIES ---------- */
function qtyText(id,g,units,buy){
  const f=FOODS[id];
  let grams=buy?g*f.raw:g;
  if(f.u){const n=grams/f.u[1];return `${n<10?(Math.round(n*2)/2):Math.round(n)} ${f.u[0]}${n>1?"s":""}`}
  if(!buy)return units==="metric"?`${Math.round(grams)} g`:`${Math.round(grams)} g (${(grams/28.35).toFixed(1)} oz)`;
  return units==="metric"?`${Math.round(grams/10)*10} g`:grams>=454?`${(grams/453.6).toFixed(1)} lb`:`${Math.round(grams/28.35)} oz`;
}
function grocery(week,units,pf){
  const tot={};
  week.days.forEach(d=>d.meals.forEach(m=>m.items.forEach(it=>tot[it.id]=(tot[it.id]||0)+it.g)));
  const groups={};
  Object.keys(tot).forEach(id=>{
    const f=FOODS[id],cat=f.cat||"Other";
    (groups[cat]=groups[cat]||[]).push({id,name:f.n,cooked:tot[id],text:qtyText(id,tot[id],units,true),cost:foodCost(id,tot[id])*(pf||1)});
  });
  Object.values(groups).forEach(a=>a.sort((x,y)=>y.cooked-x.cooked));
  return groups;
}

/* ---------- AUTO-ADJUST FROM WEIGHT LOG ---------- */
function weightTrend(log,todayISO){
  const pts=Object.keys(log).filter(d=>log[d]&&log[d].w>0&&diffD(d,todayISO)<=21&&diffD(d,todayISO)>=0).sort().map(d=>({x:diffD(addD(todayISO,-21),d),y:log[d].w}));
  if(pts.length<4||pts[pts.length-1].x-pts[0].x<7)return null;
  const n=pts.length,mx=pts.reduce((a,p)=>a+p.x,0)/n,my=pts.reduce((a,p)=>a+p.y,0)/n;
  let sxy=0,sxx=0;pts.forEach(p=>{sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2});
  const slope=sxx?sxy/sxx:0;
  return {perWeek:slope*7,avg:my,pct:slope*7/my*100,n};
}
function advice(p,tr){
  if(!tr)return null;
  const tgt={cut:{cons:-.4,std:-.7,agg:-1},bulk:{cons:.15,std:.3,agg:.5}}[p.goal==="cut"?"cut":p.goal==="bulk"?"bulk":""];
  const target=tgt?tgt[p.rate]:0,tol=tgt?.2:.2;
  const diff=target-tr.pct;
  if(Math.abs(diff)<=tol)return {delta:0,target,msg:"On track. Keep calories the same."};
  const raw=diff/100*tr.avg*7700/7,delta=Math.max(-250,Math.min(250,Math.round(raw/25)*25));
  return {delta,target,msg:`Trend ${tr.pct.toFixed(2)}%/wk vs target ${target.toFixed(2)}%/wk. ${delta>0?"Add":"Remove"} ${Math.abs(delta)} kcal/day.`};
}

function onField(el){
  const k=el.dataset.p,p=S.prof;
  if(el.type==="number"){

}

/* ---------- PLAN ---------- */

  $("kpis").innerHTML=`

   <div class="kpi"><div class="l">P / C / F target</div><div class="v" style="font-size:1.1rem">${Math.round(m.P)} / ${Math.round(m.C)} / ${Math.round(m.F)} g</div><div class="mbar"><div class="p" style="width:${m.P*4/m.kcal*100}%"></div><div class="c" style="width:${m.C*4/m.kcal*100}%"></div><div class="f" style="width:${m.F*9/m.kcal*100}%"></div></div></div>
   <div class="kpi"><div class="l">Meals provide P / C / F</div><div class="v" style="font-size:1.1rem">${a.P} / ${a.C} / ${a.F} g</div><div class="s">${d.kind==="train"?"Training day: carbs +10%":d.phase?d.phase.l:"Rest day: carbs lower"}</div></div>
   <div class="kpi"><div class="l">Hydration</div><div class="v" style="color:var(--accent)">${water} L</div><div class="s">Steady, to thirst. No cutting.</div></div>`;
  const retest=W.wk===3&&!W.peak?`<div class="note"><b>Deload & retest week.</b> Do lighter sets, then test max strict reps and update them here. Every new number rebuilds your next block.<div class="fgrid" style="margin-top:8px;max-width:340px"><div class="cg"><label>Max pull-ups</label><input type="number" inputmode="numeric" data-p="pullMax" value="${p.pullMax}"/></div><div class="cg"><label>Max push-ups</label><input type="number" inputmode="numeric" data-p="pushMax" value="${p.pushMax}"/></div></div></div>`:"";
  const note=retest+(d.phase?`<div class="note"><b>${esc(d.phase.l)}.</b> ${PEAKNOTE[d.phase.k]}</div>`:"");
  $("peakNote").innerHTML=note;
  if(d.session){
    const s=d.session;
    $("wTitle").textContent=`${s.name}`;
    $("wBadge").textContent=`Week ${s.wk+1} · ${s.rir} RIR`;
    $("wList").innerHTML=`<div class="d" style="margin-bottom:6px">Warm-up: 5 min easy cardio and joint circles, then 2 ramp-up sets of the first exercise.</div>`+
     s.ex.map((e,i)=>row(`${d.date}|ex|${i}`,esc(e.name),`<b>${e.sets} × ${e.reps}</b> · ${e.rir} RIR · rest ${e.rest}s<br>${esc(e.load)}`,
      `${e.note?`<div class="d">${esc(e.note)}</div>`:""}<div class="cue">${esc(e.cue)}</div><input class="perf" data-perf="${esc(e.uid)}" placeholder="Last top set (e.g. 45 lb × 8)" value="${esc(S.perf[e.uid]||"")}"/>`,
      `<button type="button" class="rest" data-t="${e.rest}">⏱ ${e.rest}s</button>${e.key!=="pump"?`<button type="button" class="rest" data-swap="${esc(e.key)}">↻ swap</button>`:""}`)).join("");
  }else{
    $("wTitle").textContent=d.label;$("wBadge").textContent=d.kind==="rest"?"Recovery":"No lifting";
    const walk=d.kind==="flush"?"35 min Zone 2 walk, nasal breathing. 4 × 45s dead hangs. 5 × 20s stomach vacuums.":d.kind==="posing"?"10 min mobility, 5 × 20s stomach vacuums, practice poses. No hard training.":(T.goal==="cut"?"30–40 min Zone 2 walk (conversational pace) plus 10 min mobility. Target 9–11k steps.":"20–30 min easy walk plus 10 min mobility. Target 7–9k steps.");
    $("wList").innerHTML=`<div class="d" style="font-size:.88rem">${walk}</div>`;
  }
  $("mBadge").textContent=`${d.meals.length} meals`;
  $("mList").innerHTML=d.meals.map((mm,i)=>{
    const BARE=["banana","egg","apple","avocado"];
    const items=mm.items.map(it=>`${qtyText(it.id,it.g,p.units,false)}${FOODS[it.id].u&&BARE.includes(FOODS[it.id].u[0])?"":" "+FOODS[it.id].n.toLowerCase()}`).join(" · ");
    return row(`${d.date}|meal|${i}`,esc(mm.name),esc(items||"Add your own"),
      `<div class="macros"><span class="mk">${mm.kcal} kcal</span><span class="mk">≈${(mm.cost||0).toFixed(2)}</span><span class="mp">P ${mm.P}</span><span class="mc">C ${mm.C}</span><span class="mf">F ${mm.F}</span></div>${mm.prep?`<div class="cue">${esc(mm.prep)}</div>`:""}${mm.rec?`<details class="rec"><summary>Recipe · ${esc(mm.rec[0])}</summary><ol>${mm.rec.slice(1).map(x=>`<li>${esc(x)}</li>`).join("")}</ol></details>`:""}`,
      mm.custom?"":`<button type="button" class="rest" data-mswap="${d.date}|${i}">↻ new meal</button>`);
  }).join("");
  const steps=T.goal==="cut"?"9–11k":"7–9k";
  $("hList").innerHTML=[
   ["water",`Drink ${water} L water`,"Mostly before the evening."],
   ["move",d.session&&d.kind==="train"?`Hit all sets with ${d.session.rir} RIR`:`Walk ${steps} steps`,d.session&&d.kind==="train"?"Log your top sets so next week beats them.":"Easy movement speeds recovery."],
   ["sleep","Sleep 7.5–9 h","Same bedtime, cool dark room, screens off 45 min before."]
  ].map(h=>row(`${d.date}|hab|${h[0]}`,h[1],h[2])).join("");
}

/* ---------- GROCERY ---------- */
const STAPLES=["Salt, pepper, herbs and spices","Lemon / lime","Garlic","Cooking spray or parchment paper","Optional: creatine monohydrate 3–5 g/day"];
function renderGrocery(){
  const g=grocery(W,S.prof.units,S.prof.priceF),order=["Protein","Carbohydrates","Produce","Fats","Supplements","Other"],wk=weekMon();
  let out="",total=0,done=0,cost=0;
  order.forEach(cat=>{
    if(!g[cat])return;
    out+=`<h3>${cat}</h3>`;
    g[cat].forEach(it=>{const k=`${wk}|g|${it.id}`;total++;if(S.checks[k])done++;cost+=it.cost;out+=row(k,esc(it.name),`Buy about <b>${it.text}</b> (raw / packaged) · ≈${it.cost.toFixed(2)}`)});
  });
  out+="<h3>Staples</h3>"+STAPLES.map((s,i)=>{const k=`${wk}|g|staple${i}`;total++;if(S.checks[k])done++;return row(k,esc(s),"")}).join("");
  $("gList").innerHTML=out;
  $("gBadge").textContent=`${done} / ${total} bought · ≈${Math.round(cost)} / week`;
  $("gShare").onclick=()=>shareList(g,order);
}

function shareList(g,order){
  const txt="Groceries, week of "+weekMon()+"\n"+order.filter(c=>g[c]).map(c=>c+"\n"+g[c].map(i=>"- "+i.name+": "+i.text).join("\n")).join("\n\n");
  if(navigator.share)navigator.share({title:"Grocery list",text:txt}).catch(()=>{});
  else if(navigator.clipboard)navigator.clipboard.writeText(txt).then(()=>alert("Grocery list copied")).catch(()=>alert(txt));
  else alert(txt);
}
/* ---------- PROGRESS ---------- */
let logDate=TODAY;
function renderProgress(){
  const l=S.log[logDate]||{};
  $("logDate").value=logDate;
  $("lw").value=l.w?dW(l.w):"";$("lwa").value=l.wa?dL(l.wa):"";$("ls").value=l.s??"";$("le").value=l.e??"";$("ln").value=l.n??"";
  $("lwl").textContent=`Morning weight (${wU()})`;$("lwal").textContent=`Waist at navel (${lU()})`;
  renderTrend();renderCheckin();
}
function renderCheckin(){
  const last7=[];for(let i=0;i<7;i++)last7.push(addD(TODAY,-i));
  const av=k=>{const v=last7.map(d=>parseFloat((S.log[d]||{})[k])).filter(x=>x>0);return v.length?r1(v.reduce((a,b)=>a+b,0)/v.length):"–"};
  let n=0,t=0;W.days.forEach(d=>{const p=dayProg(d);n+=p.n;t+=p.t});
  $("checkin").innerHTML=`<div class="kpis"><div class="kpi"><div class="l">Adherence (this week)</div><div class="v">${t?Math.round(n/t*100):0}%</div></div><div class="kpi"><div class="l">Avg sleep (7 d)</div><div class="v">${av("s")} h</div></div><div class="kpi"><div class="l">Avg energy (7 d)</div><div class="v">${av("e")} / 5</div></div></div>`;
}
function renderTrend(){
  const tr=weightTrend(S.log,TODAY),adv=advice(S.prof,tr);
  $("trend").innerHTML=tr?`<div class="kpis"><div class="kpi"><div class="l">21-day trend</div><div class="v">${tr.perWeek>0?"+":""}${r1(metric()?tr.perWeek:tr.perWeek*LB)} ${wU()}/wk</div><div class="s">${tr.pct.toFixed(2)}% per week · ${tr.n} weigh-ins</div></div><div class="kpi"><div class="l">Auto-adjust</div><div class="s" style="font-size:.85rem;color:var(--text)">${esc(adv.msg)}</div>${adv.delta?`<button class="btn" id="btnUseWt" style="margin-top:6px">Set bodyweight to ${dW(tr.avg)} ${wU()}</button> <button class="btn" id="btnApply" data-delta="${adv.delta}" style="margin-top:6px">Apply ${adv.delta>0?"+":""}${adv.delta} kcal</button>`:""}${S.prof.kcalAdj?` <button class="btn" id="btnClearAdj" style="margin-top:6px">Clear adjustment (${S.prof.kcalAdj>0?"+":""}${S.prof.kcalAdj})</button>`:""}</div></div>`
   :`<div class="d">Log at least 4 morning weigh-ins across 7+ days to unlock the weight trend and calorie auto-adjust.</div>`;
  $("logWt").innerHTML=weightChart();
}
function weightChart(){
  const days=[];for(let i=27;i>=0;i--)days.push(addD(TODAY,-i));
  const pts=days.map((d,i)=>S.log[d]&&S.log[d].w?{x:i,y:S.log[d].w}:null).filter(Boolean);
  if(pts.length<2)return `<svg viewBox="0 0 360 120" width="100%"><text x="180" y="60" text-anchor="middle" fill="#8793a3" font-size="11">Log weight to see the chart</text></svg>`;
  const ys=pts.map(p=>dW(p.y)),lo=Math.min(...ys)-.5,hi=Math.max(...ys)+.5;
  const X=i=>25+i*(320/27),Y=v=>100-((v-lo)/(hi-lo))*80;
  return `<svg viewBox="0 0 360 120" width="100%"><polyline fill="none" stroke="#3b82f6" stroke-width="2" points="${pts.map(p=>X(p.x)+","+Y(dW(p.y))).join(" ")}"/>${pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(dW(p.y))}" r="3" fill="#3b82f6"/>`).join("")}<text x="2" y="${Y(hi)+4}" fill="#8793a3" font-size="9">${r1(hi)}</text><text x="2" y="${Y(lo)}" fill="#8793a3" font-size="9">${r1(lo)}</text><text x="25" y="116" fill="#8793a3" font-size="9">28 days ago</text><text x="345" y="116" text-anchor="end" fill="#8793a3" font-size="9">today</text></svg>`;
}

/* ---------- OVERALL ---------- */
function renderOverall(){
  let n=0,t=0;W.days.forEach(d=>{const p=dayProg(d);n+=p.n;t+=p.t});
  const pct=t?Math.round(n/t*100):0;
  $("overallFill").style.width=pct+"%";$("overallTxt").textContent=`${pct}% of the week · ${n}/${t}`;
  $("sub").textContent=`${S.prof.goal==="cut"?"Fat loss":S.prof.goal==="bulk"?"Lean muscle gain":S.prof.goal==="peak"?"Event peak":"Recomp"} · ${S.prof.days} days · ${S.prof.style==="cal"?"calisthenics-first":S.prof.style==="wt"?"weights-first":"hybrid"} · saves in this browser`;
}
function renderAll(skipProfile){
  if(!skipProfile)buildProfile();
  renderOverview();renderPlan();renderGrocery();renderProgress();renderOverall();
}

/* ---------- EVENTS ---------- */
let deb=null;
document.addEventListener("input",e=>{
  const t=e.target;
  if(t.matches("[data-p]")){clearTimeout(deb);deb=setTimeout(()=>onField(t),t.type==="number"?250:0);if(t.tagName==="SELECT"||t.type==="date"){clearTimeout(deb);onField(t)}}
  else if(t.matches("[data-m] input")){onMulti(t.closest("[data-m]"),t)}
  else if(t.matches("[data-perf]")){S.perf[t.dataset.perf]=t.value;save()}
  else if(t.id==="logDate"){logDate=t.value||TODAY;renderProgress()}
  else if(["lw","lwa","ls","le","ln"].includes(t.id)){
    const l=S.log[logDate]=S.log[logDate]||{};
    if(t.id==="lw")l.w=t.value?fromW(parseFloat(t.value)):0;
    if(t.id==="lwa")l.wa=t.value?fromL(parseFloat(t.value)):0;
    if(t.id==="ls")l.s=t.value;if(t.id==="le")l.e=t.value;if(t.id==="ln")l.n=t.value;
    save();
    clearTimeout(deb);deb=setTimeout(renderTrend,400);
  }
});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.k){S.checks[t.dataset.k]=t.checked;save();renderPlan();renderGrocery();renderOverall()}
});
document.addEventListener("click",e=>{
  const t=e.target;
  const tm=t.closest("[data-t]");
  if(tm){e.preventDefault();startTimer(+tm.dataset.t);return}
  const sw=t.closest("[data-swap]");
  if(sw){const k=sw.dataset.swap;S.swaps[k]=(S.swaps[k]||0)+1;save();regen();renderAll(true);return}
  const ms=t.closest("[data-mswap]");
  if(ms){const [date,i]=ms.dataset.mswap.split("|");const a=S.mswaps[date]=S.mswaps[date]||[];a[+i]=(a[+i]||0)+1;save();regen();renderAll(true);return}
  const dy=t.closest("[data-day]");
  if(dy){S.sel=dy.dataset.day;save();renderPlan();return}
  const wk=t.closest("[data-wk]");
  if(wk){const v=+wk.dataset.wk;S.weekOffset=v===0?0:S.weekOffset+v;save();regen();renderAll(true);return}
  const tab=t.closest(".tab");
  if(tab){document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x===tab));document.querySelectorAll(".pane").forEach(x=>x.classList.toggle("active",x.id==="pane-"+tab.dataset.tab));return}
  switch(t.id){
    case "btnWake":toggleWake();break;
    case "btnSyncConnect":{const v=$("syncToken").value.trim();if(!v)break;SY={token:v};saveSY();renderSync();syncNow();break}
    case "btnSyncNow":syncNow();break;
    case "btnSyncOff":SY={};saveSY();setMsg("Not connected");renderSync();break;
    case "btnSyncLink":shareLink();break;
    case "btnConfirm":S.confirmed=true;save();fillProfile();break;
    case "btnRotate":S.blockOffset++;S.blockStart=mondayOf(TODAY);S.swaps={};S.weekOffset=0;save();regen();renderAll(true);break;
    case "btnApply":S.prof.kcalAdj=Math.max(-500,Math.min(500,(S.prof.kcalAdj||0)+(+t.dataset.delta)));commit();break;
    case "btnClearAdj":S.prof.kcalAdj=0;commit();break;
    case "btnExport":{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:"application/json"}));a.download="elite-peaking-backup.json";a.click();URL.revokeObjectURL(a.href);break}
    case "btnImport":$("fileIn").click();break;
    case "btnReset":if(confirm("Reset the profile, log and all checks?")){S=freshState();save();regen();renderAll()}break;
    case "btnUseWt":{const tr=weightTrend(S.log,TODAY);if(tr){S.prof.kg=tr.avg;commit();fillProfile()}break}
  }
});
$("fileIn").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(txt=>{
    const v=JSON.parse(txt);
    if(!v||typeof v!=="object"||!v.prof)throw new Error("not a backup file");
    const fr=freshState();S=Object.assign(fr,v,{prof:Object.assign(fr.prof,v.prof)});
    save();regen();renderAll();
  }).catch(err=>alert("Import failed: "+err.message)).finally(()=>{e.target.value=""});
});

/* ---------- SYNC ---------- */
const SYNCF="elite-os-sync.json",SYNCD="elite-os-sync";
let SY=(()=>{try{return JSON.parse(localStorage.getItem("elitePeakingSync_v1")||"{}")}catch(e){return {}}})();
const saveSY=()=>{try{localStorage.setItem("elitePeakingSync_v1",JSON.stringify(SY))}catch(e){console.warn(e)}};
let syncMsg=SY.token?"Connected":"Not connected",pushT=null,syncing=false;
function setMsg(m){syncMsg=m;const el=$("syncMsg");if(el)el.textContent=m}
function syncData(){return {mtime:S.mtime||Date.now(),data:Object.fromEntries(SYNCKEYS.map(k=>[k,S[k]]))}}
function applyData(d,mtime){
  SYNCKEYS.forEach(k=>{if(d[k]!==undefined)S[k]=d[k]});
  S.prof=Object.assign(JSON.parse(JSON.stringify(DEFP)),S.prof);
  lastSnap=snapOf();S.mtime=mtime||Date.now();save();regen();renderAll();
}
async function gh(path,opt){
  const r=await fetch("https://api.github.com"+path,Object.assign({headers:{Authorization:"Bearer "+SY.token,Accept:"application/vnd.github+json","Content-Type":"application/json"}},opt));
  if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;throw e}
  return r.json();
}
async function findGist(){
  for(let pg=1;pg<=5;pg++){
    const list=await gh("/gists?per_page=100&page="+pg);
    const g=list.find(x=>x.description===SYNCD);
    if(g)return g;
    if(list.length<100)break;
  }
  return null;
}
const gistBody=()=>JSON.stringify({description:SYNCD,public:false,files:{[SYNCF]:{content:JSON.stringify(syncData())}}});
function schedulePush(){clearTimeout(pushT);pushT=setTimeout(syncNow,4000)}
async function syncNow(){
  if(!SY.token||syncing)return;
  syncing=true;setMsg("Syncing…");
  try{
    if(!SY.gist){const g=await findGist();if(g){SY.gist=g.id;saveSY()}}
    if(!SY.gist){const g=await gh("/gists",{method:"POST",body:gistBody()});SY.gist=g.id;saveSY();setMsg("Synced (first upload)")}
    else{
      const g=await gh("/gists/"+SY.gist),f=g.files&&g.files[SYNCF];
      let remote=null;
      if(f)remote=JSON.parse(f.truncated?await (await fetch(f.raw_url)).text():f.content);
      if(remote&&remote.mtime>(S.mtime||0)){applyData(remote.data,remote.mtime);setMsg("Pulled newer data "+new Date().toLocaleTimeString())}
      else if(!remote||remote.mtime<(S.mtime||0)){await gh("/gists/"+SY.gist,{method:"PATCH",body:gistBody()});setMsg("Synced "+new Date().toLocaleTimeString())}
      else setMsg("Up to date "+new Date().toLocaleTimeString());
    }
  }catch(e){
    if(e.status===401||e.status===403){setMsg("Token rejected");}
    else if(e.status===404&&SY.gist){SY.gist="";saveSY();setMsg("Sync file missing, retry")}
    else setMsg("Sync failed: "+e.message);
    console.warn("sync error",e);
  }finally{syncing=false}
}
function renderSync(){
  const box=$("syncBox");if(!box)return;
  setMsg(syncMsg);
  box.innerHTML=(SY.token
   ?`<div class="d">Connected. Changes upload a few seconds after you make them, and the newest data downloads when you open the app.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><button class="btn" id="btnSyncNow">Sync now</button><button class="btn danger" id="btnSyncOff">Disconnect this device</button></div>`
   :`<div class="d">One-time setup per device, about a minute. <a href="https://github.com/settings/tokens/new?scopes=gist&description=elite-os-sync" target="_blank" rel="noopener" style="color:var(--accent)">Create a token</a> (leave only the gist box ticked, pick no expiration), paste it here, and tap Connect. Do the same on your other device. Your data syncs through a private gist in your GitHub account.</div><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"><input type="password" id="syncToken" placeholder="Paste token" style="flex:1;min-width:180px"/><button class="btn" id="btnSyncConnect">Connect</button></div>`)
   +`<h3>No account? Send a link</h3><div class="d">Creates a link holding your progress. Open it on your other device to load it there.</div><div style="margin-top:8px"><button class="btn" id="btnSyncLink">Share sync link</button></div>`;
}
async function toB64(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  const buf=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream("gzip"))).arrayBuffer());
  let s="";buf.forEach(b=>s+=String.fromCharCode(b));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
async function fromB64(t){
  const s=atob(t.replace(/-/g,"+").replace(/_/g,"/"));
  const buf=Uint8Array.from(s,c=>c.charCodeAt(0));
  return JSON.parse(await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text());
}
async function shareLink(){
  try{
    const url=location.href.split("#")[0]+"#s="+await toB64(syncData());
    if(navigator.share)await navigator.share({title:"Elite OS progress",url});
    else if(navigator.clipboard){await navigator.clipboard.writeText(url);alert("Sync link copied. Open it on your other device.")}
    else prompt("Copy this link",url);
  }catch(e){if(e.name!=="AbortError")alert("Could not make the link: "+e.message)}
}
async function importHash(){
  if(!location.hash.startsWith("#s="))return;
  try{
    const r=await fromB64(location.hash.slice(3));
    history.replaceState(null,"",location.href.split("#")[0]);
    if(r&&r.data&&confirm("Replace this device's progress with the data from the link?"))applyData(r.data);
  }catch(e){alert("That sync link could not be read.");console.warn(e)}
}
function initSync(){
  importHash();
  if(SY.token)syncNow();
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&SY.token)syncNow()});
}
/* ---------- WAKE LOCK ---------- */
let wl=null,wlWant=false;
async function getWake(){
  try{wl=await navigator.wakeLock.request("screen");wl.addEventListener("release",()=>{wl=null});}
  catch(e){wlWant=false;alert("Keep-screen-on is not supported in this browser.")}
}
async function toggleWake(){
  if(wlWant){wlWant=false;if(wl)await wl.release();wl=null}else{wlWant=true;await getWake()}
  renderPlan();
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&wlWant&&!wl)getWake().then(renderPlan)});
/* ---------- REST TIMER ---------- */
let tmr=null,left=0;
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){console.warn(e)}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(a.currentTime+.4)}catch(e){console.warn("beep failed",e)}}
function drawClock(){$("clk").textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`}
function startTimer(s){clearInterval(tmr);left=s;$("timer").className="run";drawClock();tmr=setInterval(()=>{left--;drawClock();if(left<=0){clearInterval(tmr);$("timer").className="end";beep();if(navigator.vibrate)navigator.vibrate([200,100,200])}},1000)}
$("tStop").addEventListener("click",()=>{clearInterval(tmr);left=0;$("timer").className="";drawClock()});
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||!W)return;
  const i=W.days.findIndex(d=>d.date===S.sel);
  if(e.key==="ArrowRight"&&i<6){S.sel=W.days[i+1].date;save();renderPlan()}
  if(e.key==="ArrowLeft"&&i>0){S.sel=W.days[i-1].date;save();renderPlan()}
});

regen();renderAll();initSync();
